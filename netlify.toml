[build]
  command = "node netlify/build-alden.mjs"
  publish = "outputs/alden"
  functions = "netlify/functions"

[[redirects]]
  from = "/character-sheet.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/alden"
  to = "/"
  status = 301

[[redirects]]
  from = "/alden/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/.netlify/functions/get-portrait"
  [headers.values]
    Cache-Control = "no-cache"
